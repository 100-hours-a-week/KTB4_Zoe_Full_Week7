<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votle - 게시글 목록</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/posts.css" />
    <script src="../js/pages/posts.js" type="module"></script>
  </head>
  <body data-auth="user">
    <div class="app-shell">
      <div id="header-root"></div>

      <main class="main">
        <section class="posts" aria-labelledby="posts-title">
          <h2 id="posts-title" class="sr-only">게시글 목록</h2>

          <div class="posts__toolbar">
            <div class="pill-tab-group">
              <button type="button" class="pill-tab pill-tab--active" data-post-sort="latest" aria-pressed="true">최신순</button>
              <button type="button" class="pill-tab" data-post-sort="popular" aria-pressed="false">인기순</button>
            </div>
            <a class="posts__write" href="./post-create.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              글쓰기
            </a>
          </div>

          <div class="posts__search">
            <svg class="posts__search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.5-3.5"></path>
            </svg>
            <input
              id="post-search"
              type="search"
              placeholder="제목, 내용 또는 작성자로 검색"
              autocomplete="off"
              aria-label="게시글 검색"
            />
            <button id="post-search-clear" type="button" aria-label="검색어 지우기" hidden>지우기</button>
          </div>

          <section id="post-list" class="post-list" aria-label="게시글 목록"></section>
        </section>
      </main>
    </div>
  </body>
</html>
