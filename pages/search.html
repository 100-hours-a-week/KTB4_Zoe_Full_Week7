<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votle - 검색</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/search.css" />
    <script src="../js/pages/search.js" type="module"></script>
  </head>
  <body data-auth="user">
    <div class="app-shell">
      <div id="header-root"></div>

      <main class="main">
        <section class="search" aria-labelledby="search-title">
          <h2 class="sr-only" id="search-title">검색 결과</h2>

          <p class="search__summary">
            '<b id="search-query">선물</b>' 검색 결과 <b class="search__summary-count">2건</b>
          </p>

          <div class="search__list">
            <a class="search__card" href="./post-detail.html?id=988">
              <div class="search__card-meta">
                <span class="avatar" aria-hidden="true">서</span>
                <div>
                  <div class="search__card-name">서른의나</div>
                  <div class="search__card-time">3시간 전</div>
                </div>
              </div>
              <div class="search__card-title">
                기념일, 현금 vs <span class="hl">선물</span> 뭐가 나아요?
              </div>
              <div class="search__card-body">
                곧 100일인데 남자친구가 뭐 갖고 싶냐고 물어봐요. 마음이 담긴 <span class="hl">선물</span>이 나을지 고민이에요.
              </div>
            </a>
            <a class="search__card" href="./post-detail.html?id=340">
              <div class="search__card-meta">
                <span class="avatar" aria-hidden="true">주</span>
                <div>
                  <div class="search__card-name">주말요정</div>
                  <div class="search__card-time">1일 전</div>
                </div>
              </div>
              <div class="search__card-title">
                부모님 <span class="hl">선물</span>, 실용템 vs 감성템?
              </div>
              <div class="search__card-body">
                이번 어버이날 <span class="hl">선물</span> 고민 중이에요. 다들 어떤 걸 더 좋아하실까요?
              </div>
            </a>
          </div>

          <div class="search__empty">
            <div class="search__empty-icon">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </div>
            <div class="search__empty-title">검색 결과가 없어요</div>
            <p class="search__empty-copy">다른 키워드로 검색하거나,<br />직접 새로운 이야기를 만들어보세요.</p>
            <a class="button button--pill search__empty-cta" href="./post-create.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              새 글 쓰기
            </a>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
