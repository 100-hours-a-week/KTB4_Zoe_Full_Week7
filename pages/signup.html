<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votle - 회원가입</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/auth.css" />
    <script type="module" src="../js/pages/signup.js"></script>
  </head>
  <body data-auth="guest">
    <div class="app-shell">
      <div id="header-root"></div>

      <main class="main main--auth main--signup">
        <section class="section auth" aria-labelledby="signup-title">
          <h2 class="page-title" id="signup-title">회원가입</h2>
          <p class="page-subtitle">1분이면 충분해요. 지금 투표에 참여해보세요.</p>

          <div class="auth__card">
            <form id="signup-form" class="form signup-form">
              <div class="profile-upload">
                <label id="profile-button" class="profile-upload__control" for="profile-image" aria-label="프로필 사진 추가">
                  <img id="profile-preview" class="avatar" alt="프로필 미리보기" hidden />
                  <span id="profile-placeholder" class="avatar" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                  </span>
                  <input id="profile-image" name="profileImage" type="file" accept="image/*" hidden />
                </label>
                <div class="profile-upload__hint">
                  <p class="profile-upload__label">프로필 사진<span class="required-mark">*</span></p>
                  프로필 이미지를<br />등록해주세요 (선택)
                </div>
                <p id="profile-helper" class="form__helper profile-upload__helper">* 프로필 사진을 추가해주세요</p>
              </div>

              <div class="form__group">
                <label class="form__label" for="nickname">닉네임<span class="required-mark">*</span></label>
                <input class="form__control" id="nickname" name="nickname" type="text" placeholder="닉네임을 입력하세요" />
                <p id="nickname-helper" class="form__helper">* 닉네임을 입력해주세요</p>
              </div>

              <div class="form__group">
                <label class="form__label" for="email">이메일<span class="required-mark">*</span></label>
                <input class="form__control" id="email" name="email" type="email" placeholder="이메일을 입력하세요" />
                <p id="email-helper" class="form__helper">* 이메일을 입력해주세요.</p>
              </div>

              <div class="form__group">
                <label class="form__label" for="password">비밀번호<span class="required-mark">*</span></label>
                <input class="form__control" id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" />
                <p id="password-helper" class="form__helper">* 비밀번호를 입력해주세요</p>
              </div>

              <div class="form__group">
                <label class="form__label" for="password-confirm">비밀번호 확인<span class="required-mark">*</span></label>
                <input class="form__control" id="password-confirm" name="password-confirm" type="password" placeholder="비밀번호를 한번 더 입력하세요" />
                <p id="passwordConfirm-helper" class="form__helper">* 비밀번호를 한번더 입력해주세요</p>
              </div>

              <div class="form__agreement">
                <span class="form__inline-check-box" aria-hidden="true">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                </span>
                <span>이용약관 및 개인정보 처리방침에 동의합니다</span>
              </div>

              <button id="signup-button" type="submit" class="button button--block" disabled>가입하기</button>
              <a class="form__footer-link" href="../index.html">로그인하러 가기</a>
            </form>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
