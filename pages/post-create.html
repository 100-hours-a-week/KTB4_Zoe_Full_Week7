<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votle - 새 글 쓰기</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/post-editor.css" />
    <script type="module" src="../js/pages/createPost.js"></script>
  </head>
  <body data-auth="user">
    <div class="app-shell">
      <div id="header-root"></div>

      <main class="main main--editor">
        <section class="editor">
          <div>
            <div class="editor__header">
              <span class="editor__title">새 글 쓰기</span>
            </div>
            <p class="editor__subtitle">궁금한 걸 자유롭게 물어보세요</p>
          </div>

          <form id="create-form" class="editor-form">
            <div class="editor-card">
              <div class="editor-form__group">
                <label class="editor-form__label sr-only" for="post-title">제목</label>
                <input class="editor-form__input" id="post-title" name="title" type="text" maxlength="26" placeholder="제목을 입력하세요. (최대 26글자)" />
              </div>

              <div class="editor-form__group">
                <label class="editor-form__label sr-only" for="post-content">내용</label>
                <textarea class="editor-form__textarea" id="post-content" name="content" placeholder="본문을 입력하세요. 상황을 자세히 설명할수록 더 많은 사람들이 이야기에 참여해요."></textarea>
                <p id="editor-helper" class="form__helper">* 제목, 내용을 모두 작성해주세요</p>
              </div>

              <div class="editor-form__group">
                <span class="editor-form__label">사진 첨부</span>
                <div class="file-field">
                  <label class="file-field__button" for="post-image">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a5 5 0 0 1-7-7l9.2-9.2a3.3 3.3 0 1 1 4.7 4.7l-9.1 9.1a1.7 1.7 0 0 1-2.4-2.4l8.5-8.5"/></svg>
                    파일 선택
                  </label>
                  <input id="post-image" name="image" type="file" accept="image/*" hidden />
                  <span id="file-url" class="file-field__name">파일을 선택해주세요.</span>
                </div>
              </div>
            </div>

            <div class="editor__actions">
              <button type="button" class="button button--pill button--ghost">임시저장</button>
              <button id="confirm-button" class="button button--pill editor__submit" type="submit" disabled>게시하기</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
