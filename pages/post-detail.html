<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votle - 게시글</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/post-detail.css" />
    <script src="../js/pages/PostDetail.js" type="module"></script>
  </head>
  <body data-auth="user" data-owner="mine">
    <div class="app-shell">
      <div id="header-root"></div>

      <main class="main main--post-detail">
        <div class="post-detail-wrapper">
          <div class="post-detail-wrapper__chip">
            <span id="post-owner-chip" class="section-chip section-chip--mine">내가 쓴 글</span>
          </div>

          <article class="post-detail">
            <header class="post-detail__header">
              <div class="post-detail__author">
                <img id="author-profile" class="avatar avatar--md" alt="" />
                <div class="post-detail__meta">
                  <strong id="author-name" class="post-detail__author-name"></strong>
                  <time id="created-at" class="post-detail__date"></time>
                </div>
              </div>

              <div class="post-detail__more" tabindex="0">
                <button class="post-detail__more-button" type="button" aria-label="더보기">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
                </button>
                <div class="post-detail__more-panel">
                  <div id="post-actions" class="post-detail__more-owner" hidden>
                    <a id="post-edit-link" class="post-detail__more-item" href="./post-edit.html">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                      수정하기
                    </a>
                    <button id="post-delete-button" class="post-detail__more-item post-detail__more-item--danger" type="button">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                      삭제하기
                    </button>
                  </div>
                  <div class="post-detail__more-guest">
                    <button id="post-report-button" class="post-detail__more-item post-detail__more-item--danger" type="button">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                      신고하기
                    </button>
                  </div>
                </div>
              </div>
            </header>

            <h1 id="title" class="post-detail__title"></h1>

            <img id="image" class="post-detail__image" alt="" hidden />

            <p id="content" class="post-detail__body"></p>

            <div class="post-detail__counters" aria-label="게시글 통계">
              <button id="like-button" class="counter like-button" type="button" data-liked="false">
                <span class="counter__label">좋아요</span>
                <span id="like-count"></span>
              </button>
              <div class="counter">
                <span id="view-count"></span>
                <span class="counter__label">조회수</span>
              </div>
            </div>

            <section class="post-detail__comments" aria-labelledby="comments-title">
              <h2 id="comments-title" class="post-detail__comments-title">
                댓글 <span id="comment-count">0</span>
              </h2>

              <div class="post-detail__comments-login-prompt" aria-hidden="true">
                <p class="post-detail__comments-login-prompt-copy">댓글을 남기려면 로그인이 필요해요</p>
                <a class="button button--pill" href="../index.html">로그인하고 댓글쓰기</a>
              </div>

              <div class="comment-form">
                <span class="comment-form__avatar" aria-hidden="true"></span>
                <div class="comment-form__body">
                  <textarea id="comment-content" class="comment-form__textarea" placeholder="따뜻한 한마디를 남겨주세요"></textarea>
                  <div class="comment-form__footer">
                    <button id="comment-button" class="button" type="button" disabled>등록</button>
                  </div>
                </div>
              </div>

              <section id="comment-list" class="comment-list" aria-label="댓글 목록"></section>
            </section>
          </article>
        </div>
      </main>
    </div>
  </body>
</html>
