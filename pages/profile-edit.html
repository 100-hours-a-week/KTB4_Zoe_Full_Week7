<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votle - 정보 수정</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/auth.css" />
    <link rel="stylesheet" href="../css/pages/profile.css" />
    <script src="../js/pages/editProfile.js" type="module"></script>
  </head>
  <body data-auth="user">
    <div class="app-shell">
      <div id="header-root"></div>

      <main class="main main--profile">
        <section class="section profile-edit" aria-labelledby="profile-edit-title">
          <h2 class="page-title" id="profile-edit-title">정보 수정</h2>
          <p class="page-subtitle">프로필과 계정 정보를 관리하세요</p>

          <div class="auth__card">
            <form id="profile-edit-form" class="form">
              <div class="profile-edit__avatar-row">
                <span id="profile-avatar" class="avatar avatar--lg" aria-hidden="true">U</span>
                <div class="profile-edit__avatar-actions">
                  <label class="button button--pill-sm" for="profile-image">사진 변경</label>
                  <button type="button" class="text-button">기본 이미지로</button>
                  <input id="profile-image" name="profileImage" type="file" accept="image/*" hidden />
                </div>
              </div>

              <div class="form__group">
                <label class="form__label" for="nickname">닉네임</label>
                <input class="form__control" id="nickname" name="nickname" type="text" placeholder="닉네임을 입력하세요" />
                <p id="nickname-helper" class="form__helper" hidden></p>
              </div>

              <div class="form__group">
                <label class="form__label" for="bio">한 줄 소개</label>
                <input class="form__control" id="bio" name="bio" type="text" placeholder="소개를 입력해주세요" />
              </div>

              <div class="form__group">
                <label class="form__label" for="profile-email">이메일</label>
                <input class="form__control" id="profile-email" type="email" readonly />
                <p class="form__helper form__helper--hint">이메일은 변경할 수 없어요</p>
              </div>

              <a class="profile-edit__link-row" href="./password-edit.html">
                <span>비밀번호 변경</span>
                <span aria-hidden="true">›</span>
              </a>

              <div class="profile-edit__footer">
                <button id="withdraw-button" type="button" class="text-button">회원 탈퇴</button>
                <div class="profile-edit__actions">
                  <a class="button button--pill button--ghost" href="./posts.html">취소</a>
                  <a id="profile-update-button" class="button button--pill" href="./posts.html">저장하기</a>
                </div>
              </div>

              <p id="profile-toast" class="toast" role="status" aria-live="polite" hidden>수정 완료</p>
            </form>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
