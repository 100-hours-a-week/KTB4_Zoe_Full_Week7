<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votle - 비밀번호 변경</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/auth.css" />
    <link rel="stylesheet" href="../css/pages/profile.css" />
    <script type="module" src="../js/pages/passwordEdit.js"></script>
  </head>
  <body data-auth="user">
    <div class="app-shell">
      <div id="header-root"></div>

      <main class="main main--profile">
        <section class="section" aria-labelledby="password-edit-title">
          <h2 class="page-title" id="password-edit-title">비밀번호 변경</h2>
          <p class="page-subtitle">안전을 위해 8자 이상의 새 비밀번호를 사용해주세요.</p>

          <div class="auth__card">
            <form id="password-edit-form" class="form">
              <div class="form__group">
                <label class="form__label" for="password">새 비밀번호</label>
                <input class="form__control" id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" />
                <p id="password-helper" class="form__helper" hidden></p>
              </div>

              <div class="form__group">
                <label class="form__label" for="password-confirm">비밀번호 확인</label>
                <input class="form__control" id="password-confirm" name="password-confirm" type="password" placeholder="비밀번호를 한번 더 입력하세요" />
                <p id="password-confirm-helper" class="form__helper" hidden></p>
              </div>

              <div class="password-edit__actions">
                <a class="button button--pill button--ghost" href="./profile-edit.html">취소</a>
                <button id="password-edit-button" class="button button--pill" type="submit" disabled>수정하기</button>
              </div>

              <p id="password-toast" class="toast" role="status" aria-live="polite" hidden>수정 완료</p>
            </form>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
